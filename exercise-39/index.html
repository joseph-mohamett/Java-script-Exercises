<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="translator-box">
        <h1 class="translator-title">Language Translator</h1>

        <div class="input-group">
          <label for="source-language">From:</label>
          <select id="source-language" name="from" class="lang-select">
            <option value="so" selected>Somali</option>
            <option value="en">English</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="zh">Chinese</option>
            <option value="tr">Turkish</option>
          </select>
        </div>

        <div class="input-group">
          <label for="target-language" class="target-label">To:</label>
          <select id="target-language" name="to" class="lang-select lang-select-target">
            <option value="en" selected>English</option>
            <option value="so">Somali</option>
            <option value="fr">French</option>
            <option value="ar">Arabic</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="zh">Chinese</option>
            <option value="tr">Turkish</option>
          </select>
        </div>

        <div class="input-group">
          <label for="source-text">Text to Translate:</label>
          <textarea id="source-text" name="text" placeholder="Enter text here..."></textarea>
        </div>

        <button class="translate-btn">Translate</button>

        <div class="result-box">
          <h2 class="result-title">Translated Text:</h2>
          <p id="translated-output"></p>
        </div>
    </div>

    <script src="main.js"></script>

</body>
</html>
